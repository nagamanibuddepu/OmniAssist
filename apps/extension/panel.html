<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OmniAssist Companion</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <div class="brand-title">
      <b>omni<span>assist</span></b>
      <span class="brand-badge">companion</span>
    </div>
    <button id="open" class="btn-secondary" title="Open full web workspace">Open Web ↗</button>
  </header>

  <div id="status">Connect to your OmniAssist backend.</div>

  <section id="auth">
    <input id="api" value="http://localhost:8000" aria-label="Backend URL" placeholder="Backend URL (http://localhost:8000)">
    <input id="web-url" value="http://localhost:5173" aria-label="Web workspace URL" placeholder="Web URL (http://localhost:5173)">
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <input id="invite-code" type="password" placeholder="Invitation code (if required)" autocomplete="one-time-code">
    <div class="row">
      <button id="login">Sign in</button>
      <button id="register" class="btn-secondary">Create account</button>
    </div>
  </section>

  <section id="workspace" hidden>
    <div class="row">
      <select id="conversation" aria-label="Conversation"></select>
      <button id="new" class="btn-secondary" style="flex:0 0 34px" title="New conversation">＋</button>
    </div>
    <div class="row">
      <button id="clear-summary" class="btn-secondary" hidden>Clear compact summary</button>
    </div>

    <select id="model" aria-label="Model"></select>
    <div id="live-model"></div>

    <div class="row">
      <button id="capture" class="btn-secondary" title="Read page text and selection">Read page</button>
      <button id="ask-page" class="btn-secondary" title="Ask OmniAssist about the active tab">Ask page</button>
      <button id="explain-selection" class="btn-secondary" title="Explain selected text on this tab">Explain selection</button>
      <button id="screenshot" class="btn-secondary" title="Capture active tab screenshot">Capture tab</button>
    </div>

    <div class="row">
      <button id="start-live" title="Stream this tab and audio to Gemini Live">Start tab live</button>
      <button id="capture-live-frame" class="btn-secondary" disabled title="Send current frame now">Capture frame</button>
      <button id="mute-mic" class="btn-secondary" disabled>Mute mic</button>
      <button id="end-live" class="btn-danger" disabled>End live</button>
    </div>
    <div class="row">
      <button id="stop-screen" class="btn-secondary" disabled>Stop screen</button>
      <button id="stop-mic" class="btn-secondary" disabled>Stop mic</button>
    </div>

    <div id="live-indicator" hidden></div>
    <div id="context" hidden></div>

    <div id="messages"></div>

    <details>
      <summary>Browser actions awaiting approval <span id="actions-count" class="pill-count">0</span></summary>
      <div id="actions"></div>
    </details>

    <details>
      <summary>Recent account activity</summary>
      <div id="activity"></div>
    </details>

    <textarea id="prompt" placeholder="Ask OmniAssist about this page, document, or task…"></textarea>
    
    <label class="search-option">
      <input type="checkbox" id="web-search"> Search the web with Tavily for this turn
    </label>

    <div class="row">
      <button id="send">Send</button>
      <button id="suggest-action" class="btn-secondary" title="Ask AI to propose a safe browser action">Suggest action</button>
      <button id="logout" class="btn-secondary" style="flex:0 0 auto">Sign out</button>
    </div>
  </section>

  <script src="panel.js"></script>
</body>
</html>
